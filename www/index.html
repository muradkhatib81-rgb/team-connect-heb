<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Team Connect</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0f172a;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .logo {
        width: 120px;
        height: 120px;
        border-radius: 28px;
        object-fit: contain;
        transform: scale(0.34);
        animation: grow 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes grow {
        from { transform: scale(0.34); opacity: 0.85; }
        to { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <img class="logo" src="./icons/icon-512.png" width="120" height="120" alt="Team Connect" />
  </body>
</html>
